[workspace]
exclude = ["launcher", "crates/eclipse-telemetry-server", "crates/eclipse-mod-registry", "third_party/wgpu-hal", "third_party/naga", "third_party/libmimalloc-sys"]
members = [
    "crates/eclipse-core",
    "crates/eclipse-dualsense",
    "crates/eclipse-narrator",
    "crates/eclipse-threads",
    "crates/eclipse-hdr",
    "crates/eclipse-world",
    "crates/eclipse-client",
    "crates/eclipse-client-lib",
    "crates/eclipse-client-core",
    "crates/eclipse-client-input",
    "crates/eclipse-client-render",
    "crates/eclipse-cosmetics",
    "crates/eclipse-command",
    "crates/eclipse-items",
    "crates/eclipse-server-files",
    "crates/eclipse-anticheat",
    "crates/eclipse-chat-filter",
    # The Model Context Protocol, shared by eclipse-ctl, eclipse-server and the launcher.
    "crates/eclipse-mcp",
    "crates/eclipse-server",
    "crates/eclipse-bots",
    "crates/eclipse-assets",
    "crates/eclipse-protocol",
    "crates/eclipse-theme",
    "crates/eclipse-prepare",
    "crates/eclipse-telemetry",
    "crates/eclipse-bench",
    "crates/eclipse-friends",
    "crates/eclipse-relay",
    "crates/eclipse-mods",
    "crates/eclipse-mod-api-gen",
    "crates/eclipse-mod-api-gen/dispatch-tests",
    "crates/cargo-eclipse-mod",
    "crates/eclipse-port-pack",
    "crates/eclipse-shaders",
    "crates/eclipse-optifine",
    "crates/eclipse-shader-api",
    "crates/eclipse-release-sign",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Ports mirror vanilla's Java signatures, index loops and nested generic types
# one to one so they can be checked against the decompiled sources.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

# wgpu-hal 30.0.1 with gfx-rs/wgpu#10124: wgpu 30 creates a Vulkan descriptor
# pool with no pool sizes while it creates the device, which Vulkan allows only
# since 1.3.215, and Intel's Windows driver for 6th-10th gen iGPUs (HD 520/530,
# UHD 620/630) crashes on it with an access violation (#746). It also fixes the
# Metal backend's lookup of the CoreGraphics HDR colour space names, which handed
# CoreGraphics a symbol's address as the string and crashed HDR output on macOS.
# And gfx-rs/wgpu#10714: on Windows, Vulkan waits for the acquire fence only in
# FIFO (VSync), where it was meant to pace frames; with VSync off it made every
# frame wait for the GPU to finish the one before (#4604).
# Drop this and the folder once a wgpu release has these fixes.
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }
# naga 30.0.1, with the fixes to its GLSL frontend that shader packs need (THIRD_PARTY_NOTICES.md).
naga = { path = "third_party/naga" }
# libmimalloc-sys 0.1.49 whose mimalloc v3 counts bits without POPCNT when MSVC builds it: the
# game died before main on CPUs without it (Core 2, #7264; THIRD_PARTY_NOTICES.md). Drop this and
# the folder once a libmimalloc-sys release has microsoft/mimalloc#1291's fix.
libmimalloc-sys = { path = "third_party/libmimalloc-sys" }

# Line tables keep file:line in backtraces; full debug info made every
# example and test binary hundreds of megabytes and slow to link.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.syn]
opt-level = 1

[profile.dev.package.proc-macro2]
opt-level = 1

[profile.dev.package.quote]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
